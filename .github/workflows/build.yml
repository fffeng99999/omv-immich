name: Build and Release

on:
  # 仅手动触发（WebUI 的 Run workflow 与 gh workflow run 等价）；不配置任何自动触发器。
  workflow_dispatch:
permissions:
  contents: write

jobs:
  lint:
    name: Lint (PHP + YAML + JSON + shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          for f in $(find usr/share/openmediavault/engined -name '*.inc'); do
            php -l "$f"
          done

      - name: Validate JSON datamodels
        run: |
          for f in $(find usr/share/openmediavault/datamodels -name '*.json'); do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo "OK: ".$argv[1]."\n";' "$f"
          done

      - name: Set up Python (yamllint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Lint workbench YAML
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            usr/share/openmediavault/workbench

      - name: Shell syntax check
        run: |
          for f in render-vars.sh debian/*.postinst debian/*.prerm debian/*.postrm \
                   usr/sbin/omv-immich-ctl \
                   usr/share/openmediavault/confdb/create.d/*.sh; do
            sh -n "$f" && echo "OK: $f"
          done

  build:
    name: Build .deb (all)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render build variables
        run: sh ./render-vars.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev debhelper build-essential fakeroot curl


      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv ../*.deb "$GITHUB_WORKSPACE/dist/" || true
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Inspect package
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/dist/*.deb)
          if dpkg-deb -f "$DEB" | grep -q '\${'; then
            echo "ERROR: unresolved placeholder left in package metadata (render-vars.sh not run?)"
            exit 1
          fi
          echo "== control =="; dpkg-deb -f "$DEB"
          echo "== contents (head) =="; dpkg-deb -c "$DEB" | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmediavault-immich
          path: ${{ github.workspace }}/dist/*.deb
