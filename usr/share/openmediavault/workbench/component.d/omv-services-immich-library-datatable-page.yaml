version: "1.0"
type: component
data:
  name: omv-services-immich-library-datatable-page
  type: datatablePage
  config:
    stateId: 7c4f1d92-6a38-4e51-9b0f-2d5a8c3e7f21
    sorters:
      - dir: asc
        prop: containerPath
    rowId: uuid
    rowEnumFmt: "{{ containerPath }}"
    selectionType: multi
    limit: 0
    store:
      proxy:
        service: Immich
        get:
          method: getLibraries
    columns:
      - name: _("Shared folder")
        prop: sharedFolderName
        flexGrow: 2
        sortable: true
      - name: _("Container path")
        prop: containerPath
        flexGrow: 2
        sortable: true
      - name: _("Read-only")
        prop: readonly
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
    actions:
      - template: create
        execute:
          type: url
          url: "/services/immich/libraries/create"
      - template: edit
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: url
          url: "/services/immich/libraries/edit/{{ _selected[0].uuid }}"
      - template: delete
        execute:
          type: request
          request:
            service: Immich
            method: deleteLibrary
            params:
              uuid: "{{ uuid }}"
