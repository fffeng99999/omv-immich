version: "1.0"
type: component
data:
  name: omv-services-immich-settings-form-page
  type: formPage
  config:
    request:
      service: Immich
      get:
        method: get
        transform:
          statusText: "{{ statusText | translate }}"
      post:
        method: set
    hints:
      - type: info
        text: _("Immich is a self-hosted photo and video backup solution. The stack is created in the Compose plugin (Services -> Compose -> Files) where it can also be inspected or edited; configure the Compose plugin shared folder first. Save the settings, click Apply, then use the buttons below to deploy and manage the stack. While the stack is running it starts automatically at boot.")
        dismissible: true
        stateId: 5b8e2c1a-9f3d-4c47-a2b6-0d84e13f7c55
    fields:
      - type: divider
        title: _("Status")
      - type: textInput
        name: statusText
        label: _("Service status")
        submitValue: false
        readonly: true
      - type: textInput
        name: runningVersion
        label: _("Running version")
        submitValue: false
        readonly: true
      - type: textInput
        name: latestVersion
        label: _("Latest version")
        submitValue: false
        readonly: true
      - type: checkbox
        name: updateAvailable
        label: _("Update available")
        submitValue: false
        readonly: true
      - type: divider
        title: _("Service")
      - type: checkbox
        name: enable
        label: _("Enabled")
        hint: _("Automatically manage the stack from OMV. On Apply the stack is (re)created; disabling the service removes the containers on Apply (photos and database are kept).")
        value: false

      - type: divider
        title: _("Version")
      - type: textInput
        name: version
        label: _("Immich version tag")
        hint: _("Docker image tag for immich-server and the machine-learning service (e.g. release or v3.2.4). 'release' follows the latest stable release. Prefer pinning a specific version; upgrade with the Upgrade button or change the tag here and Apply.")
        value: "v3.2.4"
        validators:
          required: true
      - type: checkbox
        name: mlEnable
        label: _("Enable machine learning")
        hint: _("Adds the immich-machine-learning container for face recognition, smart search and OCR. Requires 4 GB+ of RAM in addition to the base stack.")
        value: false

      - type: divider
        title: _("Storage")
      - type: textInput
        name: composeFile
        label: _("Stack file (Compose plugin)")
        hint: _("Stack file location. The stack files are rendered by the Compose plugin into its shared folder and are managed there, so this path cannot be changed here. Set the folder in Services -> Compose -> Settings.")
        submitValue: false
        readonly: true
      - type: sharedFolderSelect
        name: uploadRef
        label: _("Photo library shared folder")
        hint: _("Shared folder where photos and videos are stored (container path /data). To move the photo library or the database folder, select the new folder in the form but do NOT save yet - click 'Test directories' to validate the changed folders and 'Migrate data' to copy them. Save only after the migration succeeded; the data in the old folders is removed when the settings are saved.")
        hasEmptyOption: true
        value: ""
        validators:
          requiredIf:
            operator: truthy
            arg0: enable
      - type: sharedFolderSelect
        name: dbRef
        label: _("Database shared folder")
        hint: _("Shared folder for the PostgreSQL data. Must be on a local filesystem (NFS/SMB/CIFS shares are not supported by Immich).")
        hasEmptyOption: true
        value: ""
        validators:
          requiredIf:
            operator: truthy
            arg0: enable

      - type: divider
        title: _("Database")
      - type: passwordInput
        name: dbPassword
        label: _("Database password")
        hint: _("Postgres password, generated automatically on plugin installation. Changing it after the first deployment requires resetting the database directory.")
        value: ""
        autocomplete: "new-password"
      - type: textInput
        name: dbUsername
        label: _("Database username")
        value: "postgres"
      - type: textInput
        name: dbDatabaseName
        label: _("Database name")
        value: "immich"

      - type: divider
        title: _("Network")
      - type: numberInput
        name: port
        label: _("Web port")
        hint: _("Port of the Immich web interface (container port is fixed at 2283).")
        value: 2283
        validators:
          min: 1
          max: 65535
          patternType: port
      - type: textInput
        name: timeZone
        label: _("Timezone")
        hint: _("Timezone used inside the containers, e.g. Asia/Shanghai.")
        value: "Etc/UTC"
    buttons:
      - text: _("Test directories")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Validate the selected shared folders")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: testDir
                params:
                  uploadRef: "{{ uploadRef }}"
                  dbRef: "{{ dbRef }}"
      - text: _("Migrate data")
        confirmationDialogConfig:
          template: confirmation
          message: _("Do you really want to migrate the data of the changed folders? The service is stopped, the data is copied with rsync (the originals stay untouched) and the stack is started temporarily on the new locations so that you can verify it. Nothing is saved until you click Save; the data in the old folders is removed when the settings are saved.")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Directory migration")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: migrate
                params:
                  uploadRef: "{{ uploadRef }}"
                  dbRef: "{{ dbRef }}"
      - text: _("Start")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Immich deploy/start output")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: start
      - text: _("Stop")
        confirmationDialogConfig:
          template: confirmation
          message: _("Do you really want to stop the Immich stack? The containers are removed; photos, database and settings are kept.")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Immich stop output")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: stop
      - text: _("Restart")
        confirmationDialogConfig:
          template: confirmation
          message: _("Do you really want to restart the Immich stack?")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Immich restart output")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: restart
      - text: _("Upgrade")
        confirmationDialogConfig:
          template: confirmation
          message: _("Do you really want to upgrade the Immich stack? Newer images are pulled and the stack is recreated. Read the upstream release notes before major upgrades.")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Immich upgrade output")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: upgrade
      - text: _("View logs")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Immich logs")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: getLog
      - text: _("View compose file")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Rendered docker-compose.yml")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: getShowConfig
      - text: _("Open Immich")
        execute:
          type: url
          url: "/externalRedirect/{{ ['http://', location() | get('hostname'), ':', port] | join | encodeuricomponent }}"
      - template: cancel
        execute:
          type: url
          url: "/services/immich"
      - template: submit
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Removing the previous data")
              width: "70%"
              startOnInit: true
              request:
                service: Immich
                method: cleanupOld
